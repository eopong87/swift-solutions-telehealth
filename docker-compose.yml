version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: swiftadmin
      POSTGRES_PASSWORD: SwiftPass123!
      POSTGRES_DB: swiftdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://swiftadmin:SwiftPass123!@db:5432/swiftdb
    depends_on:
      - db

volumes:
  postgres_data:
