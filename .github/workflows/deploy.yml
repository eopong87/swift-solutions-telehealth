name: Deploy Swift Solutions

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          cd backend
          docker build -t swift-solutions-backend .
          docker tag swift-solutions-backend:latest 971983845745.dkr.ecr.us-east-1.amazonaws.com/swift-solutions-backend:latest
          docker push 971983845745.dkr.ecr.us-east-1.amazonaws.com/swift-solutions-backend:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster swift-solutions-cluster \
            --service swift-solutions-service \
            --force-new-deployment

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React app
        run: |
          cd frontend
          npm install
          CI=false npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/build/ s3://swift-solutions-frontend --delete
